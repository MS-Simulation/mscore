[package]
name = "mscorepy"
version = "0.1.0"
edition = "2021"
rust-version = "1.84"
license = "MIT"
description = "Python bindings for mscore + ms-chem: MS-general peptide/chemistry/spectrum primitives (tokenizer, product-ion series, mass/mz/CCS). No ms-io/timsim in the closure, so no TDF/Bruker-file I/O."
repository = "https://github.com/theGreatHerrLebert/mscore"

[lib]
name = "mscorepy"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.29.0", features = ["extension-module"] }
numpy = "0.29.0"
mscore = { path = "../mscore", version = "0.5.0" }
ms-chem = { path = "../ms-chem", version = "0.1.0" }
rayon = "1.10"
regex = "1.11"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
