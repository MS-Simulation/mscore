[package]
name = "ms-io"
version = "0.2.0"
edition = "2021"
authors = ["David Teschner <davidteschner@googlemail.com>"]
description = "Bruker timsTOF TDF read/write (SDK-free or vendor SDK) with 4D feature finding and pseudo-spectra."
license = "MIT"
repository = "https://github.com/MS-Simulation/mscore"
documentation = "https://docs.rs/ms-io"
readme = "README.md"
keywords = ["mass-spectrometry", "proteomics", "timstof", "bruker", "tdf"]
categories = ["data-structures", "science"]
rust-version = "1.84"

[lib]
name = "ms_io"
path = "src/lib.rs"

[dependencies]
# Dynamic library loading
libloading = "0.8.6"
# SQLite with bundled binaries
rusqlite = { version = "0.32.1", features = ["bundled"] }
# Compression libraries
lzf = "1.0.0"
zstd = "0.13.3"
# Byte order utilities
byteorder = "1.5.0"
# Core library for computational proteomics
mscore = { path = "../mscore", version = "0.5.0" }
# Parallelism
rayon = "1.10.0"
# Serialization
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
# Random number generation
rand = "0.8.5"
rustc-hash = "2.1.0"
bincode = "1.3.3"
polars = { version = "0.43.1", features = ["ndarray", "parquet", "dtype-u8"] }
